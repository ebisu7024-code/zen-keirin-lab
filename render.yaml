services:
  - type: web
    name: zen-keirin-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ZEN_KEIRIN_APP_PASSWORD
        sync: false
